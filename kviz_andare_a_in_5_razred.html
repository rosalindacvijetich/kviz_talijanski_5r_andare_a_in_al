<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andare A, IN ili AL?</title><style>
 :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#27334b;background:#fff8f5}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:790px;margin:auto}.hero{background:linear-gradient(120deg,#ffe0ec,#d9efff);padding:28px;border-radius:27px;border:3px solid #fff;box-shadow:0 10px 25px #b7a4b325}.hero h1{margin:0;font-size:clamp(26px,5vw,40px)}.hero p{margin:9px 0 0;font-size:17px}.ribbon{display:flex;justify-content:space-between;gap:10px;margin:22px 0;font-weight:700}.track{height:13px;background:#f1e4f2;border-radius:15px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ec8ebc,#79cdb0);width:0%;transition:width .3s}.question{background:#fff;border-radius:23px;padding:27px;margin-top:18px;box-shadow:0 8px 25px #d7b9bc35;border:2px solid #f4dbe4}.num{font-size:13px;color:#8d5889;font-weight:800;letter-spacing:.05em}.word{font-size:clamp(20px,4vw,28px);font-weight:850;margin:12px 0 22px}.opts{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}button{font:inherit;cursor:pointer}.opt{border:2px solid #dddaeb;background:#f9f8ff;border-radius:15px;padding:15px;font-size:17px;font-weight:700;min-height:60px}.opt:hover{border-color:#a18cdd}.opt:disabled{cursor:default;opacity:.7}.opt.correct{background:#e0fae8;border-color:#2dab69;opacity:1}.opt.wrong{background:#fff0ed;border-color:#ed897e;opacity:1}.feedback{margin-top:18px;padding:14px;border-radius:14px;background:#edf9ff;line-height:1.6}.go{background:#a55ce0;color:white;border:0;border-radius:14px;padding:15px 24px;font-weight:800;margin-top:18px}.go:disabled{opacity:.4;cursor:not-allowed}.end{background:white;padding:32px;text-align:center;border-radius:23px;margin-top:22px}.float{position:fixed;top:15%;left:50%;transform:translateX(-50%);pointer-events:none;font-size:clamp(34px,7vw,65px);font-weight:900;color:#128d52;text-shadow:0 4px 0 white;animation:pop .9s ease-out forwards;z-index:99;white-space:nowrap}.flower{position:fixed;font-size:30px;pointer-events:none;z-index:98;animation:fall 1.25s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,40px) scale(.4)}30%{opacity:1;transform:translate(-50%,0) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-38px) scale(1)}}@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(280deg)}}.help{font-size:14px;line-height:1.4;margin-top:15px;color:#625b69}@media print{button{color:#222!important}.go{display:none}}
 </style></head><body><main class="wrap"><header class="hero"><h1>🌸 Andare A, IN ili AL?</h1><p>Dopuni 15 talijanskih rečenica · 5. razred</p><p><strong>Upute:</strong> Klikni odgovor. Ako pogriješiš, možeš pokušati ponovno. Za točan odgovor dobivaš cvjetić i pohvalu! 🌼</p></header><div class="ribbon"><span id="step"></span><span id="points"></span></div><div class="track"><div class="fill" id="fill"></div></div><section id="stage"></section></main><script>
 const questions=[{"q": "Lui va ___ scuola.", "opts": ["A", "IN", "AL"], "answer": 0, "why": "Lui va a scuola. Uz scuola koristi se a."}, {"q": "Carla va ___ fare due passi.", "opts": ["A", "IN", "AL"], "answer": 0, "why": "Carla va a fare due passi. A + infinitiv: a fare due passi."}, {"q": "Noi andiamo ___ piscina.", "opts": ["A", "IN", "AL"], "answer": 1, "why": "Noi andiamo in piscina. Kažemo in piscina."}, {"q": "Mia va ___ palestra ogni giorno.", "opts": ["A", "IN", "AL"], "answer": 1, "why": "Mia va in palestra ogni giorno. Kažemo in palestra."}, {"q": "Vai ___ concerto.", "opts": ["A", "IN", "AL"], "answer": 2, "why": "Vai al concerto. Al = a + il: andare al concerto."}, {"q": "Gino e Giulio vanno ___ cinema.", "opts": ["A", "IN", "AL"], "answer": 2, "why": "Gino e Giulio vanno al cinema. Al = a + il: andare al cinema."}, {"q": "Sabina va ___ scuola.", "opts": ["A", "IN", "AL"], "answer": 0, "why": "Sabina va a scuola. A scuola je ustaljen izraz."}, {"q": "Voi andate ___ teatro stasera?", "opts": ["A", "IN", "AL"], "answer": 0, "why": "Voi andate a teatro stasera? Kažemo a teatro."}, {"q": "Anna e Eva vanno ___ pizzeria.", "opts": ["A", "IN", "AL"], "answer": 1, "why": "Anna e Eva vanno in pizzeria. Kažemo in pizzeria."}, {"q": "Tu vai ___ bici dai nonni.", "opts": ["A", "IN", "AL"], "answer": 1, "why": "Tu vai in bici dai nonni. Prijevoz biciklom: in bici."}, {"q": "Io vado ___ biblioteca dopo scuola.", "opts": ["A", "IN", "AL"], "answer": 1, "why": "Io vado in biblioteca dopo scuola. Kažemo in biblioteca."}, {"q": "Noi andiamo ___ Italia in estate.", "opts": ["A", "IN", "AL"], "answer": 1, "why": "Noi andiamo in Italia in estate. Uz državu Italia koristimo in."}, {"q": "Sara va ___ casa dopo la lezione.", "opts": ["A", "IN", "AL"], "answer": 0, "why": "Sara va a casa dopo la lezione. Kažemo a casa."}, {"q": "Domani andiamo ___ montagna.", "opts": ["A", "IN", "AL"], "answer": 1, "why": "Domani andiamo in montagna. Kažemo in montagna."}, {"q": "Marco va ___ supermercato.", "opts": ["A", "IN", "AL"], "answer": 2, "why": "Marco va al supermercato. Al = a + il: andare al supermercato."}];let index=0,firstTry=0,hadMistake=false,locked=false;const stage=document.getElementById('stage');const praises=['Bravo! 🌸','Odlično! 🌼','Bravissima! 🌷','Sjajno! 🌺','Super! 🌻'];
 function flowerParty(){const tag=document.createElement('div');tag.className='float';tag.textContent='✓ '+praises[index%praises.length];document.body.appendChild(tag);setTimeout(()=>tag.remove(),900);for(let i=0;i<10;i++){let f=document.createElement('span');f.className='flower';f.textContent=['🌸','🌼','🌷','✨','💮'][i%5];f.style.left=(35+Math.random()*30)+'%';f.style.top='29%';f.style.setProperty('--x',(Math.random()*650-325)+'px');f.style.setProperty('--y',(Math.random()*250+100)+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}}
 function draw(){document.getElementById('step').textContent='Pitanje '+(index+1)+' / '+questions.length;document.getElementById('points').textContent='Točno iz prve: '+firstTry;document.getElementById('fill').style.width=(index/questions.length*100)+'%';let q=questions[index];stage.innerHTML='';const el=document.createElement('article');el.className='question';el.innerHTML='<div class="num">PITANJE '+(index+1)+'</div><div class="word"></div><div class="opts"></div><div class="feedback" id="feedback" hidden></div><button class="go" id="next" disabled>'+((index===questions.length-1)?'Pogledaj rezultat →':'Sljedeće pitanje →')+'</button>';el.querySelector('.word').textContent=q.q;const options=el.querySelector('.opts');q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.addEventListener('click',()=>choose(i,b,el));options.appendChild(b)});el.querySelector('#next').onclick=next;stage.appendChild(el)}
 function choose(i,btn,el){if(locked)return;const q=questions[index];const fb=el.querySelector('#feedback');if(i===q.answer){if(!hadMistake)firstTry++;locked=true;btn.classList.add('correct');el.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.hidden=false;fb.textContent='✅ '+q.why;flowerParty();el.querySelector('#next').disabled=false;document.getElementById('points').textContent='Točno iz prve: '+firstTry}else{hadMistake=true;btn.classList.add('wrong');btn.disabled=true;fb.hidden=false;fb.textContent='💡 Pokušaj još jednom! Pročitaj izraz pažljivo.'}}
 function next(){index++;hadMistake=false;locked=false;if(index===questions.length){document.getElementById('step').textContent='Kviz završen!';document.getElementById('fill').style.width='100%';stage.innerHTML='<div class="end"><div style="font-size:70px">🏆🌷</div><h2>Bravissima!</h2><h3>Točno iz prvog pokušaja: '+firstTry+' / '+questions.length+'</h3><p>Sve riješeno! Svaka vježba pomaže da bolje naučiš talijanski.</p><button class="go" onclick="restart()">Riješi ponovno ↻</button></div>'}else{draw();window.scrollTo({top:0,behavior:'smooth'})}}
 function restart(){index=0;firstTry=0;hadMistake=false;locked=false;draw()}draw();
 </script></body></html>
